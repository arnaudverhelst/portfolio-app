<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<div id="app">
<header class="top"><div class="brand"><h1>My Portfolio</h1></div><span id="msg" class="mu"></span>
<div class="tools"><div class="pw" id="ixw"><button class="ixb" id="ixb" title="Comparison index" aria-label="Comparison index"><span class="ixk">Index</span><span id="ixl">World</span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button><div class="pop" id="ixp" hidden></div></div><button class="ib" id="upl" title="Load data and settings" aria-label="Load data and settings"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg></button><button class="ib" id="hid" title="Hide amounts" aria-label="Hide amounts"></button>
<div class="pw"><button class="ib" id="aprb" title="Appearance" aria-label="Appearance"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
<div class="pop" id="apr" hidden><div class="ps">Mode</div><div class="themes" id="themes"><button data-mode="light">Light</button><button data-mode="dark">Dark</button></div>
<div class="ps" style="margin-top:12px">Language</div><div class="themes" id="langs"><button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="nl">NL</button></div>
<div class="ps" style="margin-top:12px">Currency</div><div class="themes" id="curs"><button data-loc="0">€</button><button data-loc="1">Local</button></div>
</div></div></div></header>
<div class="modal" id="setup" hidden><div class="card mcard"><div class="mhead"><h2>Import your transactions</h2><button class="ib" id="mclose" title="Close" aria-label="Close">&#10005;</button></div>
<div class="gbar"><div id="gtabs"><button data-g="saxo" class="on">Saxo</button><button data-g="degiro">Degiro</button><button disabled title="Coming soon">Keytrade</button><button disabled title="Coming soon">Bolero</button></div>
<div class="pw" id="bkw"><button type="button" class="ixb" id="bkb" title="Which brokers to include" aria-label="Which brokers to include"><span class="ixk">View</span><span id="bkl">All brokers</span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button><div class="pop" id="bkp" hidden></div></div></div>
<div class="gcols"><div><div class="mu gh">Where to find it</div><ol id="gsteps"></ol><p class="mu" id="gnote"></p></div>
<div><label class="drop" id="drop" for="fileX"><b>Drop your files here</b><span class="mu">or click to choose. We recognise which file is which.</span></label><input type="file" id="fileX" multiple accept=".csv,.txt,.tsv,.xls,.xlsx" hidden><div id="gres"></div></div></div>
<textarea id="txt" hidden></textarea><textarea id="txtD" hidden></textarea><textarea id="txtA" hidden></textarea>
<div class="gact"><button class="go" id="run">Calculate</button><button id="clr">Clear saved data</button></div>
<input id="bv" type="hidden" value="all">
<input id="bm" type="hidden" value="IWDA.AS">
</div></div>
<div id="out"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>

</body></html>
